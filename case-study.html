<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ScaleShield — Case Study</title>
<meta name="description" content="A ScaleShield operator case study — real infrastructure, real numbers." />
<link rel="icon" href="favicon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Sora:wght@600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="ss.css">
<style>
.cs{max-width:820px;margin:0 auto}
.cs-vert{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--gold2);padding:6px 14px;border-radius:999px;background:rgba(214,177,94,.08);border:1px solid var(--line2);margin-bottom:18px}
.cs-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:36px 0}@media(max-width:680px){.cs-stats{grid-template-columns:repeat(2,1fr)}}
.cs-stat{text-align:center;padding:22px 12px;border:1px solid var(--line);border-radius:14px;background:rgba(255,255,255,.02)}
.cs-stat .n{font-family:'Sora';font-size:30px;font-weight:900}.cs-stat .l{font-size:11.5px;color:var(--mut);margin-top:4px}
article h2{font-size:26px;margin:40px 0 14px}
article h2 .num{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:8px;background:linear-gradient(135deg,var(--gold),var(--gold2));color:#1a140a;font-weight:900;font-size:15px;margin-right:10px;vertical-align:-5px}
article p{color:rgba(244,245,248,.85);margin-bottom:16px;font-size:15.5px}article p b{color:#fff}
.pull{font-size:21px;font-weight:600;line-height:1.45;border-left:3px solid var(--gold2);padding:12px 0 12px 22px;margin:28px 0;color:var(--gold2)}
.pull span{display:block;margin-top:10px;font-size:13px;color:var(--mut);font-weight:500}
.mrow{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:24px 0}@media(max-width:600px){.mrow{grid-template-columns:1fr}}
.mbox{border:1px solid var(--line);border-radius:14px;padding:20px}
.mbox.bad{border-color:rgba(255,100,110,.2);background:rgba(255,100,110,.04)}
.mbox.good{border-color:var(--line2);background:rgba(214,177,94,.04)}
.mbox .ml{font-size:11px;color:var(--mut);letter-spacing:.06em;text-transform:uppercase;margin-bottom:6px}
.mbox .mn{font-size:24px;font-weight:800;margin-bottom:4px}.mbox.bad .mn{color:#fca5a5}.mbox.good .mn{color:var(--gold2)}
.mbox .ms{font-size:13px;color:var(--mut)}
article ul{list-style:none;margin:0 0 18px;padding:0}article ul li{padding:6px 0;font-size:15px;display:flex;gap:10px;color:rgba(244,245,248,.85)}article ul li::before{content:"✓";color:var(--gold2);font-weight:800}
.cs-nav{display:flex;justify-content:space-between;gap:14px;margin-top:50px;flex-wrap:wrap}
.cs-nav a{font-size:13px;color:var(--mut);font-weight:600}.cs-nav a:hover{color:var(--gold2)}
.notfound{text-align:center;padding:120px 0}
</style>
</head>
<body>
<nav class="nav scrolled" id="nav" style="top:0"><div class="wrap nav-inner">
  <a href="index.html" class="brand"><img src="logo.png" alt="ScaleShield"><span>Scale<span class="grad">Shield</span></span></a>

  <div class="nav-cta"><a href="case-studies.html" class="btn btn-ghost btn-sm">← All studies</a><a href="https://t.me/scaleshieldsupport" target="_blank" rel="noopener" class="btn-login">Talk to us <small>↗</small></a><div class="burger" id="burger"><span></span><span></span><span></span></div></div>
</div></nav>
<div class="drawer" id="drawer"><div class="drawer-close" id="drawerClose">×</div><a href="index.html">Home <small>→</small></a><a href="case-studies.html">All case studies <small>→</small></a><a href="pricing.html">Pricing <small>→</small></a><a href="presentation.html">CRM Tour <small>→</small></a><a href="https://t.me/scaleshieldsupport" target="_blank" rel="noopener">Telegram <small>↗</small></a></div>

<div id="cs-root"></div>

<a href="https://t.me/scaleshieldsupport" target="_blank" rel="noopener" class="float-tg" aria-label="Telegram"><svg viewBox="0 0 24 24"><path d="M9.78 18.65l.28-4.23 7.68-6.92c.34-.31-.07-.46-.52-.19L7.74 13.3 3.64 12c-.88-.25-.89-.86.2-1.3l15.97-6.16c.73-.33 1.43.18 1.15 1.3l-2.72 12.81c-.19.91-.74 1.13-1.5.71L12.6 16.3l-1.99 1.93c-.23.23-.42.42-.83.42z"/></svg></a>
<script src="cases.js"></script>
<script>
(function(){
  var cases = window.SS_CASES || [];
  var id = new URLSearchParams(location.search).get("id");
  var idx = cases.findIndex(function(c){return c.id===id;});
  var c = cases[idx];
  var root = document.getElementById("cs-root");
  if(!c){
    root.innerHTML = '<div class="phero" style="padding:150px 0 80px"><div class="wrap notfound"><h1>Case study not found</h1><p style="color:var(--mut);margin-top:16px">Browse all 20 operator stories instead.</p><div style="margin-top:28px"><a href="case-studies.html" class="btn btn-primary btn-lg">View all case studies →</a></div></div></div>';
    return;
  }
  document.title = "ScaleShield Case Study — " + c.name + " · " + c.vertical;
  var md = document.querySelector('meta[name=description]'); if(md) md.setAttribute("content", c.blurb);

  var prev = cases[(idx-1+cases.length)%cases.length];
  var next = cases[(idx+1)%cases.length];
  function stats(){return c.stats.map(function(s){return '<div class="cs-stat"><div class="n grad">'+s.n+'</div><div class="l">'+s.l+'</div></div>';}).join("");}
  function bullets(){return c.results.map(function(b){return '<li>'+b+'</li>';}).join("");}

  root.innerHTML =
  '<header class="phero" style="padding:130px 0 50px"><div class="orb a"></div><div class="wrap cs">'+
    '<span class="cs-vert">'+c.vertical+' · '+c.geo+' · '+c.tier+'</span>'+
    '<h1 style="font-size:clamp(28px,4.6vw,46px)">'+c.title+'</h1>'+
    '<p style="color:var(--mut);margin-top:18px">'+c.name+' · '+c.timeframe+' on ScaleShield '+c.tier+'</p>'+
  '</div></header>'+
  '<section class="sec" style="padding:50px 0"><div class="wrap cs">'+
    '<div class="cs-stats">'+stats()+'</div>'+
    '<article>'+
      '<h2><span class="num">1</span>The problem</h2>'+
      '<p>'+c.problem+'</p>'+
      '<div class="mrow">'+
        '<div class="mbox bad"><div class="ml">'+c.problemA.l+'</div><div class="mn">'+c.problemA.n+'</div><div class="ms">'+c.problemA.s+'</div></div>'+
        '<div class="mbox bad"><div class="ml">'+c.problemB.l+'</div><div class="mn">'+c.problemB.n+'</div><div class="ms">'+c.problemB.s+'</div></div>'+
      '</div>'+
      '<h2><span class="num">2</span>The ScaleShield setup</h2>'+
      '<p>'+c.solution+'</p>'+
      '<div class="pull">"'+c.quote+'"<span>'+c.quoteBy+'</span></div>'+
      '<h2><span class="num">3</span>What '+c.timeframe+' delivered</h2>'+
      '<div class="mrow">'+
        '<div class="mbox bad"><div class="ml">'+c.resA.l+'</div><div class="mn">'+c.resA.n+'</div><div class="ms">'+c.resA.s+'</div></div>'+
        '<div class="mbox good"><div class="ml">'+c.resB.l+'</div><div class="mn">'+c.resB.n+'</div><div class="ms">'+c.resB.s+'</div></div>'+
      '</div>'+
      '<ul>'+bullets()+'</ul>'+
      '<h2><span class="num">4</span>The takeaway</h2>'+
      '<p>'+c.lesson+'</p>'+
      '<div class="cta-band" style="margin-top:50px">'+
        '<h2 style="font-size:28px">Want a setup like '+c.name.split(" ")[0]+"'s?</h2>"+
        '<p>Tell us your vertical, GEOs, and spend — we\'ll architect the right '+c.tier+' structure.</p>'+
        '<a href="https://t.me/scaleshieldsupport" target="_blank" rel="noopener" class="btn btn-primary btn-lg magnetic">Talk to ScaleShield →</a>'+
      '</div>'+
      '<div class="cs-nav"><a href="case-study.html?id='+prev.id+'">← '+prev.name+'</a><a href="case-studies.html">All 20 case studies</a><a href="case-study.html?id='+next.id+'">'+next.name+' →</a></div>'+
    '</article>'+
  '</div></section>'+
  '<footer class="foot"><div class="wrap" style="text-align:center"><p style="color:var(--mut2);font-size:13px">© 2026 ScaleShield · <a href="index.html" style="color:var(--gold2)">Home</a> · <a href="case-studies.html" style="color:var(--gold2)">All case studies</a> · <a href="pricing.html" style="color:var(--gold2)">Pricing</a></p></div></footer>';
})();
</script>
<script src="ss.js"></script>
</body>
</html>
